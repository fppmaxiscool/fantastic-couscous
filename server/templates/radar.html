<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIVOPS-RADAR // SIGINT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green: #00ff41;
            --green-dim: #00cc33;
            --green-dark: #003a0f;
            --green-glow: rgba(0,255,65,0.4);
            --red: #ff2244;
            --yellow: #ffcc00;
            --blue: #00aaff;
            --bg: #020a02;
            --panel: rgba(0,15,4,0.92);
            --border: rgba(0,255,65,0.35);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            touch-action: manipulation;
        }

        /* ── SCANLINES overlay ──────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.18) 2px,
                rgba(0,0,0,0.18) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        /* ── LAYOUT ─────────────────────────────────────── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            height: 100vh;
        }

        /* ── HEADER ─────────────────────────────────────── */
        #header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        #header-title {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--green);
            text-shadow: 0 0 10px var(--green-glow);
        }
        #header-title span { color: var(--red); }
        #status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            letter-spacing: 1px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(0,255,65,0.05);
        }
        #status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: blink 1.4s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

        /* ── STAT BAR ───────────────────────────────────── */
        #stat-bar {
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        .stat-cell {
            padding: 6px 4px;
            text-align: center;
            border-right: 1px solid var(--border);
        }
        .stat-cell:last-child { border-right: none; }
        .stat-val {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            line-height: 1;
        }
        .stat-lbl { font-size: 8px; letter-spacing: 1px; color: rgba(0,255,65,0.5); margin-top: 2px; }
        .stat-val.red   { color: var(--red);    text-shadow: 0 0 8px var(--red); }
        .stat-val.yellow{ color: var(--yellow);  text-shadow: 0 0 8px var(--yellow); }
        .stat-val.blue  { color: var(--blue);    text-shadow: 0 0 8px var(--blue); }
        .stat-val.green { color: var(--green);   text-shadow: 0 0 8px var(--green); }

        /* ── MAIN AREA ──────────────────────────────────── */
        #main {
            flex: 1 1 auto;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── RADAR CANVAS AREA ──────────────────────────── */
        #radar-wrap {
            flex: 1 1 auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #radar-canvas {
            display: block;
            /* size set by JS */
        }

        /* ── NETWORK LIST DRAWER ────────────────────────── */
        #net-drawer {
            flex: 0 0 auto;
            max-height: 36vh;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }
        #net-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(0,255,65,0.6);
            position: sticky;
            top: 0;
            background: var(--panel);
            z-index: 2;
        }
        .net-row {
            display: flex;
            align-items: center;
            padding: 9px 12px;
            border-bottom: 1px solid rgba(0,255,65,0.1);
            cursor: pointer;
            transition: background 0.15s;
            gap: 10px;
        }
        .net-row:active { background: rgba(0,255,65,0.08); }
        .net-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex: 0 0 auto;
        }
        .net-dot.low    { background: var(--green);  box-shadow: 0 0 6px var(--green); }
        .net-dot.medium { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
        .net-dot.high   { background: var(--red);    box-shadow: 0 0 6px var(--red); }
        .net-name {
            flex: 1 1 auto;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .net-name .ssid { color: var(--green); }
        .net-name .bssid { color: rgba(0,255,65,0.35); font-size: 10px; display: block; }
        .net-meta {
            flex: 0 0 auto;
            text-align: right;
            font-size: 10px;
        }
        .net-meta .dbm  { color: var(--blue); }
        .net-meta .risk { font-family: 'Orbitron', monospace; }
        .risk-low    { color: var(--green); }
        .risk-medium { color: var(--yellow); }
        .risk-high   { color: var(--red); }

        /* ── BOTTOM ACTION BAR ──────────────────────────── */
        #action-bar {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }
        .btn {
            flex: 1;
            padding: 10px 6px;
            border: 1px solid var(--border);
            background: rgba(0,255,65,0.04);
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            background: rgba(0,255,65,0.15);
            box-shadow: 0 0 12px var(--green-glow);
        }
        .btn.danger { border-color: rgba(255,34,68,0.4); color: var(--red); }
        .btn.danger:active { background: rgba(255,34,68,0.15); box-shadow: 0 0 12px rgba(255,34,68,0.4); }

        /* ── NETWORK DETAIL MODAL ───────────────────────── */
        #detail-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0,0,0,0.7);
        }
        #detail-modal.open { display: flex; }
        #detail-card {
            background: #030f03;
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            padding: 20px 16px 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 -4px 40px rgba(0,255,65,0.15);
            animation: slideUp 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }
        #detail-close {
            position: absolute;
            top: 12px; right: 16px;
            background: none;
            border: none;
            color: rgba(0,255,65,0.5);
            font-size: 22px;
            cursor: pointer;
            font-family: monospace;
        }
        .detail-title {
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            color: var(--green);
            text-shadow: 0 0 10px var(--green-glow);
            margin-bottom: 4px;
        }
        .detail-bssid { font-size: 11px; color: rgba(0,255,65,0.4); margin-bottom: 16px; }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .detail-item {
            background: rgba(0,255,65,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
        }
        .detail-item .lbl { font-size: 9px; letter-spacing: 1.5px; color: rgba(0,255,65,0.4); margin-bottom: 4px; }
        .detail-item .val { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; }

        /* ── TICKER / LOG ───────────────────────────────── */
        #ticker {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 130px;
            max-height: 80px;
            overflow: hidden;
            font-size: 9px;
            letter-spacing: 0.5px;
            color: rgba(0,255,65,0.4);
            text-align: right;
            pointer-events: none;
        }
        .tick-line { line-height: 1.6; }

        /* ── DEMO BADGE ─────────────────────────────────── */
        #demo-badge {
            position: absolute;
            top: 8px; left: 8px;
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--yellow);
            background: rgba(255,204,0,0.08);
            border: 1px solid rgba(255,204,0,0.3);
            border-radius: 4px;
            padding: 2px 7px;
        }

        /* ── LOADING ────────────────────────────────────── */
        #loading {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            gap: 16px;
            transition: opacity 0.5s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading-title {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 0 0 20px var(--green);
        }
        #loading-bar-wrap {
            width: 200px;
            height: 3px;
            background: rgba(0,255,65,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        #loading-bar {
            height: 100%;
            width: 0%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            transition: width 0.3s;
        }
        #loading-msg { font-size: 10px; letter-spacing: 2px; color: rgba(0,255,65,0.5); }

        /* scrollbar */
        #net-drawer::-webkit-scrollbar { width: 4px; }
        #net-drawer::-webkit-scrollbar-track { background: transparent; }
        #net-drawer::-webkit-scrollbar-thumb { background: rgba(0,255,65,0.3); border-radius: 2px; }
    </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading">
    <div id="loading-title">CIVOPS</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-msg">INITIALIZING SIGINT SYSTEM...</div>
</div>

<!-- APP -->
<div id="app">

    <!-- HEADER -->
    <div id="header">
        <div id="header-title">CIVOPS<span>//</span>RADAR</div>
        <div id="status-pill">
            <div id="status-dot"></div>
            <span id="status-text">LIVE</span>
        </div>
    </div>

    <!-- STAT BAR -->
    <div id="stat-bar">
        <div class="stat-cell">
            <div class="stat-val green" id="s-total">0</div>
            <div class="stat-lbl">TOTAL</div>
        </div>
        <div class="stat-cell">
            <div class="stat-val blue" id="s-active">0</div>
            <div class="stat-lbl">ACTIVE</div>
        </div>
        <div class="stat-cell">
            <div class="stat-val yellow" id="s-open">0</div>
            <div class="stat-lbl">OPEN</div>
        </div>
        <div class="stat-cell">
            <div class="stat-val red" id="s-risk">0</div>
            <div class="stat-lbl">HIGH RISK</div>
        </div>
    </div>

    <!-- MAIN -->
    <div id="main">
        <div id="radar-wrap">
            <canvas id="radar-canvas"></canvas>
            <div id="demo-badge" style="display:none">◉ DEMO DATA</div>
            <div id="ticker"></div>
        </div>

        <!-- NETWORK LIST -->
        <div id="net-drawer">
            <div id="net-drawer-header">
                <span>◈ DETECTED NETWORKS</span>
                <span id="net-count">0 TARGETS</span>
            </div>
            <div id="net-list"></div>
        </div>
    </div>

    <!-- ACTION BAR -->
    <div id="action-bar">
        <button class="btn" id="btn-scan" onclick="toggleScan()">⬡ SCAN</button>
        <button class="btn" id="btn-export" onclick="exportData()">⬇ EXPORT</button>
        <button class="btn danger" id="btn-clear" onclick="clearData()">✕ CLEAR</button>
    </div>
</div>

<!-- DETAIL MODAL -->
<div id="detail-modal" onclick="if(event.target===this)closeDetail()">
    <div id="detail-card">
        <button id="detail-close" onclick="closeDetail()">✕</button>
        <div class="detail-title" id="d-ssid"></div>
        <div class="detail-bssid" id="d-bssid"></div>
        <div class="detail-grid" id="d-grid"></div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CIVOPS-RADAR  –  Mobile UI v2
// ═══════════════════════════════════════════════════════════

const canvas  = document.getElementById('radar-canvas');
const ctx     = canvas.getContext('2d');
let   networks = new Map();
let   sweepAngle = 0;
let   animId;
let   scanning = false;
let   demoMode = false;
let   tickLines = [];
let   selectedBSSID = null;

// ── LOADING BOOT SEQUENCE ───────────────────────────────────
const loadBar = document.getElementById('loading-bar');
const loadMsg = document.getElementById('loading-msg');
const msgs = [
    'LOADING SIGINT ENGINE...',
    'CALIBRATING RF MODULES...',
    'ESTABLISHING DB LINK...',
    'READY.'
];
let li = 0;
const bootInt = setInterval(() => {
    li++;
    loadBar.style.width = (li / msgs.length * 100) + '%';
    loadMsg.textContent = msgs[li] || msgs[msgs.length-1];
    if (li >= msgs.length) {
        clearInterval(bootInt);
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
            startApp();
        }, 400);
    }
}, 500);

// ── CANVAS SIZING ───────────────────────────────────────────
function resizeCanvas() {
    const wrap = document.getElementById('radar-wrap');
    const size = Math.min(wrap.clientWidth, wrap.clientHeight) - 8;
    canvas.width  = size;
    canvas.height = size;
}
window.addEventListener('resize', () => { resizeCanvas(); });

// ── RADAR DRAW ──────────────────────────────────────────────
function drawRadar() {
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    const R  = W/2 - 4;

    ctx.clearRect(0, 0, W, H);

    // background
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    bg.addColorStop(0,   'rgba(0,30,8,0.9)');
    bg.addColorStop(0.7, 'rgba(0,15,4,0.95)');
    bg.addColorStop(1,   'rgba(0,5,2,1)');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.fill();

    // range rings
    [0.25, 0.5, 0.75, 1].forEach((f, i) => {
        ctx.beginPath();
        ctx.arc(cx, cy, R * f, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(0,255,65,${0.12 + i*0.04})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        if (f < 1) {
            ctx.fillStyle = 'rgba(0,255,65,0.2)';
            ctx.font = '8px Share Tech Mono';
            ctx.fillText(`${Math.round(f*200)}m`, cx + R*f + 3, cy - 3);
        }
    });

    // crosshairs
    ctx.strokeStyle = 'rgba(0,255,65,0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(cx, cy-R); ctx.lineTo(cx, cy+R); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-R, cy); ctx.lineTo(cx+R, cy); ctx.stroke();
    ctx.setLineDash([]);

    // diagonal crosshairs
    ctx.strokeStyle = 'rgba(0,255,65,0.06)';
    [-45, 45, 135, 225].forEach(deg => {
        const a = deg * Math.PI/180;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a)*R, cy + Math.sin(a)*R);
        ctx.stroke();
    });

    // sweep gradient trail
    const sweep = ctx.createConicalGradient
        ? null  // not widely supported; use arc instead
        : null;

    // Draw sweep as a filled arc sector (trail effect)
    for (let t = 0; t < 60; t++) {
        const a = sweepAngle - t * 0.018;
        const alpha = (1 - t/60) * 0.18;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, a - 0.018, a);
        ctx.closePath();
        ctx.fillStyle = `rgba(0,255,65,${alpha})`;
        ctx.fill();
    }

    // sweep line
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(sweepAngle)*R, cy + Math.sin(sweepAngle)*R);
    ctx.strokeStyle = 'rgba(0,255,65,0.9)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00ff41';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // center dot
    const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 400);
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI*2);
    ctx.fillStyle = '#00ff41';
    ctx.shadowColor = '#00ff41';
    ctx.shadowBlur = 12 * pulse;
    ctx.fill();
    ctx.shadowBlur = 0;

    // outer border
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(0,255,65,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // network blips
    networks.forEach(net => {
        const x = cx + net.position.x * R * 0.88;
        const y = cy + net.position.y * R * 0.88;

        let color = '#00ff41';
        if (net.risk_score > 70) color = '#ff2244';
        else if (net.risk_score > 30) color = '#ffcc00';

        const r = net.bssid === selectedBSSID ? 9 : 6;
        const glow = 6 + 4 * Math.sin(Date.now()/600 + net._phase);

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = glow;
        ctx.fill();
        ctx.shadowBlur = 0;

        // ring around selected
        if (net.bssid === selectedBSSID) {
            ctx.beginPath();
            ctx.arc(x, y, 14, 0, Math.PI*2);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // label
        if (networks.size < 20) {
            ctx.fillStyle = 'rgba(0,255,65,0.7)';
            ctx.font = '9px Share Tech Mono';
            ctx.fillText(net.ssid || '???', x + 10, y + 3);
        }
    });

    sweepAngle += 0.025;

    animId = requestAnimationFrame(drawRadar);
}

// ── PROCESS SIGNALS ─────────────────────────────────────────
function processSignals(signals) {
    signals.forEach(sig => {
        const ex = networks.get(sig.bssid) || {};
        sig._phase = ex._phase ?? (Math.random() * Math.PI * 2);
        networks.set(sig.bssid, sig);
    });
    renderNetworkList();
    updateStats();
}

// ── NETWORK LIST ────────────────────────────────────────────
function renderNetworkList() {
    const list = document.getElementById('net-list');
    const sorted = [...networks.values()].sort((a,b) => b.risk_score - a.risk_score);
    document.getElementById('net-count').textContent = sorted.length + ' TARGETS';

    list.innerHTML = sorted.map(n => {
        const risk = n.risk_score > 70 ? 'high' : n.risk_score > 30 ? 'medium' : 'low';
        const riskLabel = n.risk_score > 70 ? 'HIGH' : n.risk_score > 30 ? 'MED' : 'LOW';
        const sel = n.bssid === selectedBSSID ? 'style="background:rgba(0,255,65,0.08)"' : '';
        return `<div class="net-row" ${sel} onclick="showDetail('${n.bssid}')">
            <div class="net-dot ${risk}"></div>
            <div class="net-name">
                <span class="ssid">${n.ssid || '[ HIDDEN ]'}</span>
                <span class="bssid">${n.bssid}</span>
            </div>
            <div class="net-meta">
                <div class="dbm">${n.level} dBm</div>
                <div class="risk risk-${risk}">${riskLabel}</div>
            </div>
        </div>`;
    }).join('');
}

// ── STATS ────────────────────────────────────────────────────
function updateStats() {
    const arr = [...networks.values()];
    document.getElementById('s-total').textContent  = arr.length;
    document.getElementById('s-active').textContent = arr.filter(n => n.active !== false).length;
    document.getElementById('s-open').textContent   = arr.filter(n => n.is_open).length;
    document.getElementById('s-risk').textContent   = arr.filter(n => n.risk_score > 70).length;
}

// ── DETAIL MODAL ─────────────────────────────────────────────
function showDetail(bssid) {
    const n = networks.get(bssid);
    if (!n) return;
    selectedBSSID = bssid;
    renderNetworkList();

    document.getElementById('d-ssid').textContent  = n.ssid || '[ HIDDEN NETWORK ]';
    document.getElementById('d-bssid').textContent = n.bssid;

    const risk = n.risk_score > 70 ? '#ff2244' : n.risk_score > 30 ? '#ffcc00' : '#00ff41';
    const sec  = n.capabilities
        ? (n.capabilities.includes('WPA3') ? 'WPA3' : n.capabilities.includes('WPA2') ? 'WPA2' : n.capabilities.includes('WPA') ? 'WPA' : n.capabilities.includes('WEP') ? 'WEP' : 'OPEN')
        : (n.is_open ? 'OPEN' : 'SECURE');

    document.getElementById('d-grid').innerHTML = `
        <div class="detail-item"><div class="lbl">SIGNAL</div><div class="val" style="color:#00aaff">${n.level} dBm</div></div>
        <div class="detail-item"><div class="lbl">RISK SCORE</div><div class="val" style="color:${risk}">${n.risk_score}/100</div></div>
        <div class="detail-item"><div class="lbl">DISTANCE</div><div class="val">${n.distance ? n.distance.toFixed(0)+'m' : '???'}</div></div>
        <div class="detail-item"><div class="lbl">SECURITY</div><div class="val" style="color:${n.is_open?'#ffcc00':'#00ff41'}">${sec}</div></div>
        <div class="detail-item"><div class="lbl">FREQUENCY</div><div class="val">${n.frequency ? n.frequency+'MHz' : '—'}</div></div>
        <div class="detail-item"><div class="lbl">SEEN</div><div class="val" style="font-size:11px">${n.scan_count ?? 1}x</div></div>
    `;
    document.getElementById('detail-modal').classList.add('open');
}
function closeDetail() {
    selectedBSSID = null;
    document.getElementById('detail-modal').classList.remove('open');
    renderNetworkList();
}

// ── TICKER LOG ────────────────────────────────────────────────
function tick(msg) {
    const now = new Date().toLocaleTimeString('en', {hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
    tickLines.unshift(`[${now}] ${msg}`);
    if (tickLines.length > 5) tickLines.pop();
    document.getElementById('ticker').innerHTML = tickLines.map(l => `<div class="tick-line">${l}</div>`).join('');
}

// ── WAITING STATE ──────────────────────────────────────────────
function showWaiting() {
    document.getElementById('net-list').innerHTML = `
        <div style="padding:24px 16px; text-align:center; color:rgba(0,255,65,0.35); font-size:11px; letter-spacing:2px; line-height:2">
            <div style="font-size:28px; margin-bottom:12px">📡</div>
            <div>AWAITING SCAN DATA</div>
            <div style="margin-top:8px; font-size:9px; color:rgba(0,255,65,0.25)">
                Make sure Termux:API is installed<br>
                and Location permission is granted
            </div>
        </div>`;
    document.getElementById('net-count').textContent = '0 TARGETS';
}

// ── LIVE DATA FETCH ───────────────────────────────────────────
async function fetchSignals() {
    try {
        const r = await fetch('/api/signals');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        if (d.signals && d.signals.length > 0) {
            networks.clear();
            processSignals(d.signals);
            tick('REFRESH: ' + d.signals.length + ' REAL SIGNALS');
        } else {
            if (networks.size === 0) showWaiting();
            tick('NO SIGNALS YET — SCANNER STARTING...');
        }
    } catch(e) {
        if (networks.size === 0) showWaiting();
        tick('SERVER UNREACHABLE');
    }
}

async function fetchStats() {
    try {
        const r = await fetch('/api/statistics');
        if (!r.ok) return;
        const s = await r.json();
        if (!demoMode) {
            document.getElementById('s-total').textContent  = s.total_networks  || 0;
            document.getElementById('s-active').textContent = s.active_networks  || 0;
            document.getElementById('s-open').textContent   = s.open_networks    || 0;
            document.getElementById('s-risk').textContent   = s.high_risk_networks || 0;
        }
    } catch(e) {}
}

// ── CONTROLS ──────────────────────────────────────────────────
function toggleScan() {
    scanning = !scanning;
    const btn = document.getElementById('btn-scan');
    if (scanning) {
        btn.textContent = '⬡ STOP';
        tick('SCAN INITIATED');
        fetch('/api/scan/start').catch(()=>{});
    } else {
        btn.textContent = '⬡ SCAN';
        tick('SCAN HALTED');
        fetch('/api/scan/stop').catch(()=>{});
    }
}

function exportData() {
    tick('EXPORT TRIGGERED...');
    fetch('/api/export/json')
        .then(r => r.ok ? r.blob() : Promise.reject())
        .then(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'civops_' + Date.now() + '.json';
            a.click();
            URL.revokeObjectURL(url);
            tick('EXPORT COMPLETE');
        })
        .catch(() => {
            // fallback: export demo data
            if (demoMode) {
                const blob = new Blob([JSON.stringify([...networks.values()], null, 2)], {type:'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'civops_demo_' + Date.now() + '.json';
                a.click();
                tick('DEMO EXPORT COMPLETE');
            } else {
                tick('EXPORT FAILED');
            }
        });
}

function clearData() {
    if (!confirm('PURGE ALL SCAN DATA?')) return;
    networks.clear();
    demoMode = false;
    document.getElementById('demo-badge').style.display = 'none';
    renderNetworkList();
    updateStats();
    tick('DATABASE PURGED');
}

// ── START APP ─────────────────────────────────────────────────
function startApp() {
    resizeCanvas();
    drawRadar();
    fetchSignals();
    setInterval(fetchSignals, 5000);
    setInterval(fetchStats,   10000);
    tick('CIVOPS-RADAR ONLINE');
    tick('AWAITING SCAN DATA...');
}
</script>
</body>
</html>
